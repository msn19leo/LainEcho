appId: com.lainecho.pet
productName: LainEcho
directories:
  buildResources: build
  output: release
files:
  - dist-electron/**
  - dist/**
  - build/icon.png
  - package.json
  - "!node_modules/**"
asar: true
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LainEcho
  deleteAppDataOnUninstall: true
publish:
  provider: github
  owner: msn19leo
  repo: LainEcho
  releaseType: release
