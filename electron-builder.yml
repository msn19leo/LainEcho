appId: com.lainecho.pet
productName: LainEcho
directories:
  buildResources: build
  output: release
files:
  - dist-electron/**
  - dist/**
  - build/icon.png
  - build/icon.ico
  - package.json
  - "!node_modules/**"
asar: true
npmRebuild: false
# SBV2 sidecar：exe 与 ONNX Runtime 不能进 asar（需要真实文件路径），
# 运行时由 sbv2Tts.resolveSidecarDir() 指向 process.resourcesPath/sbv2
extraResources:
  - from: electron/services/sbv2-server/dist/sbv2-sidecar.exe
    to: sbv2/sbv2-sidecar.exe
  - from: electron/services/sbv2-server/dist/onnxruntime.dll
    to: sbv2/onnxruntime.dll
  - from: electron/services/sbv2-server/dist/DirectML.dll
    to: sbv2/DirectML.dll
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LainEcho
  deleteAppDataOnUninstall: true
publish:
  provider: github
  owner: msn19leo
  repo: LainEcho
  releaseType: release
